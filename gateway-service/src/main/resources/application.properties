spring.application.name=gateway-service

server.port=8181

eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.security=DEBUG


#Keycloak Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/spring-microservices-security-realm


#Api services URI
#product.service.url=http://localhost:8082
#inventory.service.url=http://localhost:8089
#order.service.url=http://localhost:8087

#Swagger Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/aggregate/product-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Inventory Service
springdoc.swagger-ui.urls[1].url=/aggregate/inventory-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Order Service
springdoc.swagger-ui.urls[2].url=/aggregate/order-service/v3/api-docs


#Product Service Route
spring.cloud.gateway.routes[0].id=product-service
spring.cloud.gateway.routes[0].uri=lb://product-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/product/**
spring.cloud.gateway.routes[0].filters[0]=CircuitBreaker=name=productServiceCircuitBreaker,fallbackUri=forward:/fallback/product-service
spring.cloud.gateway.routes[0].filters[1]=RewritePath=/api/product/(?<segment>.*), /api/product/${segment}


#Inventory Service Route
spring.cloud.gateway.routes[1].id=inventory-service
spring.cloud.gateway.routes[1].uri=lb://inventory-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/inventory/**
spring.cloud.gateway.routes[1].filters[0]=CircuitBreaker=name=inventoryServiceCircuitBreaker,fallbackUri=forward:/fallback/inventory-service
spring.cloud.gateway.routes[1].filters[1]=RewritePath=/api/inventory/(?<segment>.*), /api/inventory/${segment}


#Order Service Route
spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=lb://order-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/order/**
spring.cloud.gateway.routes[2].filters[0]=CircuitBreaker=name=orderServiceCircuitBreaker,fallbackUri=forward:/fallback/order-service
spring.cloud.gateway.routes[2].filters[1]=RewritePath=/api/order/(?<segment>.*), /api/order/${segment}


#Registry Service Route
spring.cloud.gateway.routes[3].id=registry-service
spring.cloud.gateway.routes[3].uri=http://localhost:8761
spring.cloud.gateway.routes[3].predicates[0]=Path=/eureka/web
spring.cloud.gateway.routes[3].filters[0]=SetPath=/

#Registry Service Static Resource Routes
spring.cloud.gateway.routes[4].id=registry-service-static
spring.cloud.gateway.routes[4].uri=http://localhost:8761
spring.cloud.gateway.routes[4].predicates[0]=Path=/eureka/**

# Swagger UI for Product Service
spring.cloud.gateway.routes[5].id=product-service-swagger
spring.cloud.gateway.routes[5].uri=lb://product-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/aggregate/product-service/v3/api-docs
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/aggregate/product-service/v3/api-docs, /v3/api-docs

# Swagger UI for Inventory Service
spring.cloud.gateway.routes[6].id=inventory-service-swagger
spring.cloud.gateway.routes[6].uri=lb://inventory-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/aggregate/inventory-service/v3/api-docs
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/aggregate/inventory-service/v3/api-docs, /v3/api-docs

# Swagger UI for Order Service
spring.cloud.gateway.routes[7].id=order-service-swagger
spring.cloud.gateway.routes[7].uri=lb://order-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/aggregate/order-service/v3/api-docs
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/aggregate/order-service/v3/api-docs, /v3/api-docs

#------------------------------------------------------------------------------------------------#


#Actuator Endpoints
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#Resilience4j Configuration
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5

#Resilience4j Timeout Configuration
resilience4j.timelimiter.configs.default.timeout-duration=20s

#Resilience4j  retry Configuration
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=2s
