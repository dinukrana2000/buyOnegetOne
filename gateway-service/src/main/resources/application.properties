spring.application.name=gateway-service

server.port=8080

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE


#Api services URI
product.service.url=http://localhost:8082
inventory.service.url=http://localhost:8089
order.service.url=http://localhost:8087

#Product Service Route
spring.cloud.gateway.mvc.routes[0].id=product-service
spring.cloud.gateway.mvc.routes[0].uri=lb://product-service
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/product/**

#Inventory Service Route
spring.cloud.gateway.mvc.routes[1].id=inventory-service
spring.cloud.gateway.mvc.routes[1].uri=lb://inventory-service
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/inventory/**

#Order Service Route
spring.cloud.gateway.mvc.routes[2].id=order-service
spring.cloud.gateway.mvc.routes[2].uri=lb://order-service
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/order/**

#Registry Service Route
spring.cloud.gateway.mvc.routes[3].id=registry-service
spring.cloud.gateway.mvc.routes[3].uri=http://localhost:8761
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/eureka/web
spring.cloud.gateway.mvc.routes[3].filters[0]=SetPath=/